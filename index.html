<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowProcess Studio</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">FP</div>
        <div>
          <h1>FlowProcess Studio</h1>
          <span>Mapeador visual de processos</span>
        </div>
      </div>

      <div class="process-title-wrap">
        <label for="processTitle">Título</label>
        <input id="processTitle" type="text" value="Processo de Solicitação" />
      </div>

      <div class="top-actions">
        <button id="btnSave" class="btn primary">Salvar</button>
        <button id="btnLoad" class="btn">Carregar</button>
        <button id="btnExportPng" class="btn">PNG</button>
        <button id="btnExportPdf" class="btn">PDF</button>
        <button id="btnClear" class="btn danger">Limpar</button>
      </div>
    </header>

    <main class="main-layout">
      <aside class="sidebar">
        <div class="tool-section">
          <h2>Ferramentas</h2>
          <button id="btnAddLane" class="tool-btn">＋ Adicionar raia</button>
          <button data-add="start" class="tool-btn">● Início</button>
          <button data-add="task" class="tool-btn">▭ Tarefa</button>
          <button data-add="decision" class="tool-btn">◇ Decisão</button>
          <button data-add="end" class="tool-btn">● Fim</button>
          <button data-add="note" class="tool-btn">☰ Anotação</button>
        </div>

        <div class="tool-section">
          <h2>Edição</h2>
          <button id="btnConnectMode" class="tool-btn connect">↗ Modo conectar</button>
          <button id="btnDeleteSelected" class="tool-btn danger-soft">Excluir selecionado</button>
        </div>

        <div class="hint-card">
          <strong>Dicas rápidas</strong>
          <p>Duplo clique em blocos ou nomes das raias para editar.</p>
          <p>Ative “Modo conectar”, clique no bloco de origem e depois no destino.</p>
        </div>
      </aside>

      <section class="workspace-wrap">
        <div class="workspace-toolbar">
          <div class="status-pill" id="statusText">Pronto para editar</div>
          <div class="mini-actions">
            <button id="btnFit" class="small-btn">Centralizar</button>
            <button id="btnAddExample" class="small-btn">Exemplo rápido</button>
          </div>
        </div>

        <div class="canvas-scroll" id="canvasScroll">
          <div class="canvas" id="canvas">
            <svg class="connector-layer" id="connectorLayer"></svg>
            <div id="lanes" class="lanes"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast">Salvo</div>
  <script src="app.js"></script>
</body>
</html>
