<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowProcess Studio</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">◇</span><strong>FlowProcess Studio</strong></div>
    <input id="processTitle" value="Processo de Solicitação de Compras" />
    <button id="saveBtn" class="green">Salvar</button>
    <button id="loadBtn">Carregar</button>
    <button id="pngBtn">Exportar PNG</button>
    <button id="pdfBtn">Exportar PDF</button>
    <button id="clearBtn" class="red">Limpar</button>
  </header>

  <main class="app">
    <aside class="sidebar">
      <section>
        <h3>FERRAMENTAS</h3>
        <button id="addLaneBtn" class="tool">▭ Adicionar Raia</button>
      </section>
      <section>
        <h3>ELEMENTOS</h3>
        <button class="tool add" data-type="start">● Início</button>
        <button class="tool add" data-type="task">▢ Tarefa</button>
        <button class="tool add" data-type="decision">◇ Decisão</button>
        <button class="tool add" data-type="end">● Fim</button>
        <button class="tool add" data-type="note">◰ Anotação</button>
      </section>
      <section>
        <h3>AÇÕES</h3>
        <button id="connectBtn" class="tool">🔗 Modo Conectar</button>
        <button id="selectBtn" class="tool active">↖ Selecionar</button>
        <button id="deleteBtn" class="tool">🗑 Excluir</button>
      </section>
      <section class="tips">
        <h3>ATALHOS</h3>
        <p><b>Duplo clique</b> edita texto</p>
        <p><b>Delete</b> exclui selecionado</p>
        <p><b>Arraste</b> para mover</p>
      </section>
    </aside>

    <section class="workspace">
      <div class="toolbar">
        <button id="pointer" class="mini active">↖</button>
        <button id="hand" class="mini">✋</button>
        <span class="sep"></span>
        <button id="zoomOut" class="mini">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn" class="mini">+</button>
      </div>
      <div id="canvasWrap">
        <div id="canvas">
          <svg id="lines"></svg>
          <div id="lanes"></div>
        </div>
      </div>
      <div class="status"><span id="countEls">Elementos: 0</span><span id="countConns">Conexões: 0</span><span id="statusZoom">100%</span></div>
    </section>
  </main>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
